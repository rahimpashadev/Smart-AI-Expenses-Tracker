<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart AI Expenses Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
    <div class="bg-white p-10 rounded shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
        <form id="loginForm" onsubmit="loginUser(event)">
            <label class="block mb-2">Email</label>
            <input id="email" type="email" placeholder="Enter your email" class="w-full p-2 mb-4 border rounded" required>
            <label class="block mb-2">Password</label>
            <input id="password" type="password" placeholder="Enter password" class="w-full p-2 mb-4 border rounded" required>
            <button type="submit" style="background:#2563eb;color:white;padding:10px 20px;border-radius:6px;border:none;">Login</button>
        </form>
        <p class="text-center mt-4">Don't have an account? <a href="signup.html" class="text-blue-600">Sign Up</a></p>
    </div>

    <script src="js_main.js"></script>
</body>
</html>
